name: evilcrow_rf2_controller
description: Mobile app for controlling Evil Crow RF v2 device via BLE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_blue_plus: ^1.31.15
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

