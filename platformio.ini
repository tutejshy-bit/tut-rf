; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = custom_partitions.csv
lib_deps = 
	spacehuhn/SimpleCLI@^1.1.4
	ESP32 BLE Arduino@^2.0.0

# ОПТИМИЗАЦИЯ РАЗМЕРА ПРОШИВКИ
build_flags = 
	# Debug level - вернул 4 для отладки проблемы с записью сигналов
	-DCORE_DEBUG_LEVEL=4
	
	# Оптимизация размера вместо скорости
	-Os
	
	# Удалять неиспользуемые функции
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	
	# Отключить неиспользуемые функции Arduino
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	
	# C++ оптимизации - УБРАЛИ -fno-exceptions для стабильности
	# -fno-exceptions      # ОТКАЧЕНО - вызывало abort() и heap corruption
	# -fno-rtti            # ОТКАЧЕНО - для надежности
	-fno-threadsafe-statics  # Оставили - безопасно
	
	# Дополнительные оптимизации
	-fmerge-all-constants
	-DDISABLE_ALL_LIBRARY_WARNINGS

# build_unflags убраны - возвращаем exceptions для стабильности
# build_unflags = 
# 	-fexceptions
# 	-frtti

# Отключить неиспользуемые библиотеки
lib_ignore = 
	Update
	HTTPUpdate

; monitor_filters = esp32_exception_decoder
; build_type = debug

monitor_speed = 115200
monitor_filters = time